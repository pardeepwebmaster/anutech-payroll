# Render Blueprint — provisions the entire Anutech Payroll stack.
# Connect this repo to Render via "New +" → "Blueprint" and Render will
# read this file and create all services automatically.
#
# Free tier limits (acceptable for demo / dev):
#   - Web services spin down after 15 min of inactivity (cold start)
#   - Postgres free DB expires after 90 days
#   - Static sites and Redis are unlimited free

databases:
  - name: anutech-postgres
    plan: free
    databaseName: anutech_payroll
    user: anutech
    postgresMajorVersion: "15"

services:
  # Redis (free key-value store)
  - type: redis
    name: anutech-redis
    plan: free
    ipAllowList: []        # no public access; only our backend will connect

  # Backend — FastAPI on Python 3.11
  - type: web
    name: anutech-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore       # closest to India
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: APP_BASE_DOMAIN
        sync: false           # set per-deploy in Render dashboard
      - key: CORS_ORIGINS
        sync: false           # set to https://anutech-frontend.onrender.com after first deploy
      - key: AUTO_INIT_DB
        value: "true"         # auto-applies master_schema.sql on startup (idempotent)
      - key: AUTO_SEED_TENANT
        value: "true"         # creates Anutech demo tenant on first boot
      - key: SEED_ADMIN_EMAIL
        value: pardeep@anutech.in
      - key: SEED_ADMIN_PASSWORD
        sync: false           # SET THIS in Render dashboard before first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: anutech-postgres
          property: connectionString
      - key: MASTER_SCHEMA
        value: public
      - key: REDIS_URL
        fromService:
          type: redis
          name: anutech-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a long random string
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: ANTHROPIC_API_KEY
        sync: false           # paste in Render dashboard (kept private)
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-7
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@anutech.in
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_PROFESSIONAL_TAX
        value: "200"
      - key: ESI_GROSS_THRESHOLD
        value: "21000"

  # Frontend — Vite static build
  - type: web
    name: anutech-frontend
    runtime: static
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: singapore
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false           # set to https://anutech-backend.onrender.com after first deploy
    routes:
      # SPA fallback — every unknown path returns index.html so client-side router takes over
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Allow this static site to be embedded in an <iframe> from anywhere.
      # X-Frame-Options "ALLOWALL" is non-standard — modern browsers ignore it
      # (which effectively allows framing); legacy browsers treat it as
      # permissive. The real enforcement comes from CSP frame-ancestors below.
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors *"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
