worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '"$http_x_tenant_slug"';
    access_log /var/log/nginx/access.log main;

    # Subdomain → tenant slug header for the backend.
    # E.g. anutech.payroll.anutech.in → X-Tenant-Slug: anutech.
    # Backend uses the JWT for tenant resolution after login; this header is
    # informational + useful for /auth/login when slug is needed.
    map $host $tenant_slug {
        default "";
        "~^(?<tenant>[a-z][a-z0-9\-]*)\.payroll\.anutech\.in$" $tenant;
        "~^(?<tenant>[a-z][a-z0-9\-]*)\.localhost$" $tenant;
    }

    # Apex / landing
    server {
        listen 80;
        server_name payroll.anutech.in localhost;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Per-tenant subdomain
    server {
        listen 80 default_server;
        server_name *.payroll.anutech.in *.localhost;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Slug $tenant_slug;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
